<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тесты поиска чат-бота</title>
    <style>
      :root { font-family: Inter, "Segoe UI", Arial, sans-serif; color: #17212b; }
      body { max-width: 760px; margin: 40px auto; padding: 0 20px; background: #f4f7f9; }
      h1 { margin-bottom: 8px; }
      .summary { padding: 12px 16px; border-radius: 10px; background: #e8f4ed; }
      .summary.failed { background: #fbeaea; }
      .test { margin: 10px 0; padding: 14px; border: 1px solid #dde5ea; border-radius: 10px; background: white; }
      .test.pass { border-left: 5px solid #238636; }
      .test.fail { border-left: 5px solid #b42318; }
      code { white-space: pre-wrap; }
      a { color: #0068b4; }
    </style>
  </head>
  <body>
    <main id="adminTests" hidden>
      <p><a href="index.html">← Вернуться к прототипу</a></p>
      <h1>Тестирование поиска и синонимов</h1>
      <p>Коридорные тест-кейсы для проверки поисковой логики MVP.</p>
      <div id="summary" class="summary" role="status" aria-live="polite"></div>
      <div id="tests"></div>
    </main>

    <script src="search-core.js"></script>
    <script>
      if (sessionStorage.getItem("bankBotAdmin") !== "true") {
        window.location.replace("index.html");
      } else {
        document.getElementById("adminTests").hidden = false;
      }

      const items = [
        { id: "money-not-arrived", title: "Не пришли деньги", categoryName: "Переводы", aliases: ["перевод не поступил", "средства не пришли", "не произошло зачисление", "не произошел возврат", "не произошёл возврат", "не вернули деньги", "платеж не дошёл"], answer: "Статус перевода" },
        { id: "block-card", title: "Как заблокировать карту?", categoryName: "Карты", aliases: ["потерял карту", "украли карту"], answer: "Блокировка карты" },
        { id: "statement", title: "Получить выписку", categoryName: "Счёт и операции", aliases: ["история операций", "справка по счёту"], answer: "Выписка" },
        { id: "open-deposit", title: "Как открыть вклад?", categoryName: "Вклады", aliases: ["открыть депозит", "начать накопительный счёт"], answer: "Вклад" }
      ];

      const cases = [
        { query: "не произошел возврат", expected: "money-not-arrived" },
        { query: "не произошёл возврат", expected: "money-not-arrived" },
        { query: "платеж не дошёл", expected: "money-not-arrived" },
        { query: "потерял карту", expected: "block-card" },
        { query: "справка по счету", expected: "statement" },
        { query: "открыть депозит", expected: "open-deposit" },
        { query: "абсолютно неизвестный запрос", expected: null }
      ];

      if (sessionStorage.getItem("bankBotAdmin") === "true") {
        let passed = 0;
        const testsElement = document.getElementById("tests");
        cases.forEach((testCase) => {
          const results = SearchCore.rankSearchResults(testCase.query, items);
          const actual = results[0]?.id || null;
          const success = actual === testCase.expected;
          if (success) passed += 1;
          const test = document.createElement("article");
          test.className = `test ${success ? "pass" : "fail"}`;
          test.innerHTML = `<strong>${success ? "PASS" : "FAIL"}:</strong> <code>${testCase.query}</code><br>Ожидалось: ${testCase.expected || "нет результатов"}; получено: ${actual || "нет результатов"}${results[0] ? ` (${results[0].relevance}%)` : ""}`;
          testsElement.appendChild(test);
        });

        const summary = document.getElementById("summary");
        summary.className = `summary ${passed === cases.length ? "" : "failed"}`;
        summary.textContent = `${passed} из ${cases.length} тестов пройдено`;
      }
    </script>
  </body>
</html>
