<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тесты поиска чат-бота</title>
    <style>
      :root { font-family: Inter, "Segoe UI", Arial, sans-serif; color: #17212b; }
      body { max-width: 760px; margin: 40px auto; padding: 0 20px; background: #f4f7f9; }
      h1 { margin-bottom: 8px; }
      .summary { padding: 12px 16px; border-radius: 10px; background: #e8f4ed; }
      .summary.failed { background: #fbeaea; }
      .test { margin: 10px 0; padding: 14px; border: 1px solid #dde5ea; border-radius: 10px; background: white; }
      .test.pass { border-left: 5px solid #238636; }
      .test.fail { border-left: 5px solid #b42318; }
      code { white-space: pre-wrap; }
      a { color: #0068b4; }
    </style>
  </head>
  <body>
    <main id="adminTests" hidden>
      <p><a href="index.html">← Вернуться к прототипу</a></p>
      <h1>Тестирование поиска и синонимов</h1>
      <p>Коридорные тест-кейсы для проверки поисковой логики MVP.</p>
      <div id="summary" class="summary" role="status" aria-live="polite"></div>
      <div id="tests"></div>
    </main>

    <script src="search-core.js"></script>
    <script>
      if (sessionStorage.getItem("bankBotAdmin") !== "true") {
        window.location.replace("index.html");
      } else {
        document.getElementById("adminTests").hidden = false;
      }

      const items = [
        { id: "block-card", title: "Как заблокировать карту?", question: "Как заблокировать карту?", categoryName: "Карты", aliases: ["потерял карту", "украли карту"], answer: "Заблокируйте карту в приложении" },
        { id: "card-not-arrived", title: "Карта ещё не пришла", question: "Что делать, если карта ещё не пришла?", categoryName: "Карты", aliases: ["нет пластика", "карта не доставлена"], answer: "Проверьте статус доставки" },
        { id: "card-limit", title: "Изменить лимит по карте", question: "Как изменить лимит по карте?", categoryName: "Карты", aliases: ["предел перевода", "ограничение карты"], answer: "Измените лимит в настройках" },
        { id: "money-not-arrived", title: "Не пришли деньги", question: "Что делать, если деньги не пришли?", categoryName: "Переводы", aliases: ["перевод не поступил", "не произошел возврат"], answer: "Проверьте статус перевода" },
        { id: "cancel-transfer", title: "Отменить перевод", question: "Как отменить перевод?", categoryName: "Переводы", aliases: ["отменить платеж", "вернуть перевод"], answer: "Проверьте статус перевода" },
        { id: "transfer-limit", title: "Лимит на переводы", question: "Как изменить лимит на переводы?", categoryName: "Переводы", aliases: ["максимальный перевод", "лимиты переводов"], answer: "Проверьте лимиты" },
        { id: "open-deposit", title: "Открыть вклад", question: "Как открыть вклад?", categoryName: "Вклады", aliases: ["открыть депозит", "накопительный счет"], answer: "Откройте раздел вкладов" },
        { id: "close-deposit", title: "Закрыть вклад", question: "Как закрыть вклад?", categoryName: "Вклады", aliases: ["снять вклад", "закрыть депозит"], answer: "Закройте вклад в приложении" },
        { id: "statement", title: "Получить выписку", question: "Как получить выписку?", categoryName: "Счета и операции", aliases: ["история операций", "справка по счету"], answer: "Скачайте выписку" },
        { id: "unknown-payment", title: "Незнакомое списание", question: "Что делать, если обнаружено незнакомое списание?", categoryName: "Счета и операции", aliases: ["не узнаю платеж", "сняли деньги без меня"], answer: "Оспорьте операцию" }
      ];

      const cases = [
        { query: "не произошел возврат", expected: "money-not-arrived" },
        { query: "не произошёл возврат", expected: "money-not-arrived" },
        { query: "платеж не дошёл", expected: "money-not-arrived" },
        { query: "что делать если карта еще не пришла", expected: "card-not-arrived" },
        { query: "потерял карту", expected: "block-card" },
        { query: "как изменить лимит на переводы", expected: "transfer-limit" },
        { query: "справка по счету", expected: "statement" },
        { query: "что делать если обнаружено незнакомое списание", expected: "unknown-payment" },
        { query: "открыть депозит", expected: "open-deposit" },
        { query: "абсолютно неизвестный запрос", expected: null }
      ];

      if (sessionStorage.getItem("bankBotAdmin") === "true") {
        let passed = 0;
        const testsElement = document.getElementById("tests");
        cases.forEach((testCase) => {
          const results = SearchCore.rankSearchResults(testCase.query, items);
          const actual = results[0]?.id || null;
          const success = actual === testCase.expected;
          if (success) passed += 1;
          const test = document.createElement("article");
          test.className = `test ${success ? "pass" : "fail"}`;
          test.innerHTML = `<strong>${success ? "PASS" : "FAIL"}:</strong> <code>${testCase.query}</code><br>Ожидалось: ${testCase.expected || "нет результатов"}; получено: ${actual || "нет результатов"}${results[0] ? ` (${results[0].relevance}%)` : ""}`;
          testsElement.appendChild(test);
        });

        const summary = document.getElementById("summary");
        summary.className = `summary ${passed === cases.length ? "" : "failed"}`;
        summary.textContent = `${passed} из ${cases.length} тестов пройдено`;
      }
    </script>
  </body>
</html>
